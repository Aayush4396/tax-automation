[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tax_automation"
version = "2.0.0"
description = "Centralized, config-driven financial transaction processing & consolidation engine"
authors = [{ name = "Antigravity Team" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "msoffcrypto-tool>=5.0.0",
    "pdfplumber>=0.10.0",
    "xlrd>=2.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

